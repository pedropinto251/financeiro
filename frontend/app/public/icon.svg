<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Financeiro">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b1020" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#sheen)"/>

  <!-- Rising chart bars -->
  <g filter="url(#soft)">
    <rect x="132" y="296" width="46" height="92"  rx="16" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="200" y="248" width="46" height="140" rx="16" fill="#ffffff" fill-opacity="0.72"/>
    <rect x="268" y="196" width="46" height="192" rx="16" fill="#ffffff" fill-opacity="0.9"/>
  </g>

  <!-- Euro mark -->
  <g transform="translate(330,150)" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round">
    <path d="M70 18 A58 58 0 1 0 70 116"/>
    <path d="M14 52 H86"/>
    <path d="M8 82 H78"/>
  </g>

  <!-- Trend line -->
  <path d="M150 250 L220 210 L288 158 L356 110" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-opacity="0.95"/>
  <circle cx="356" cy="110" r="13" fill="#ffffff"/>
</svg>
